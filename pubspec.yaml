name: naxter
description: تطبيق ناكستر Naxter المحاسبي العربي الاحترافي.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  fl_chart: ^0.69.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/Cairo-Regular.ttf
