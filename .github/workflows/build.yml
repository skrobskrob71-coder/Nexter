name: Build Nakster Flutter Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name=naxter --platforms=android --org=com.naxter .
      - name: Set Android application id
        run: |
          grep -rl 'com.naxter.naxter' android | xargs -r sed -i 's/com\.naxter\.naxter/com.naxter.app/g'
          rm -rf test
      - name: Get packages
        run: flutter pub get
      - name: Patch legacy Android plugins
        run: |
          SCANNER_GRADLE=$(find "$PUB_CACHE" -path '*flutter_barcode_scanner-2.0.0/android/build.gradle' -print -quit)
          if [ -n "$SCANNER_GRADLE" ]; then
            grep -q "namespace" "$SCANNER_GRADLE" || sed -i "/android[[:space:]]*{/a\\    namespace 'com.amolg.flutterbarcodescanner'" "$SCANNER_GRADLE"
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/g' "$SCANNER_GRADLE"
          fi
          BLUE_GRADLE=$(find "$PUB_CACHE" -path '*/bluetooth_print-*/android/build.gradle' -print -quit)
          if [ -n "$BLUE_GRADLE" ]; then
            if ! grep -q "namespace" "$BLUE_GRADLE"; then
              sed -i '0,/android[[:space:]]*{/s//android {\n    namespace "com.gprinter.bluetooth_print"/' "$BLUE_GRADLE"
            fi
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/g' "$BLUE_GRADLE"
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK release with shrinking
        run: flutter build apk --release --shrink
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nakster-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nakster-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
