name: Build Nexter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Select JDK 17
        shell: bash
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aidl"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Link SDK for Buildozer
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$HOME/.buildozer/android/platform"
          rm -rf "$SDK"
          mkdir -p "$SDK/tools/bin" "$SDK/cmdline-tools"
          ln -s "$ANDROID_HOME/cmdline-tools/latest" "$SDK/cmdline-tools/latest"
          ln -s "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -s "$ANDROID_HOME/platform-tools" "$SDK/platform-tools"
          ln -s "$ANDROID_HOME/build-tools" "$SDK/build-tools"
          ln -s "$ANDROID_HOME/platforms" "$SDK/platforms"
          test -x "$SDK/tools/bin/sdkmanager"
          test -x "$SDK/build-tools/34.0.0/aidl"
          test -x "$SDK/platform-tools/adb"
          "$SDK/tools/bin/sdkmanager" --version

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexter-debug-apk
          path: bin/*.apk
          if-no-files-found: error
