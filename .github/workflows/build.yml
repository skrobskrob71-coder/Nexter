name: Build Nexter APK Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: kivy/buildozer:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install compatibility packages
        run: |
          python -m pip install --no-cache-dir legacy-cgi

      - name: Build APK
        run: |
          yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexter-debug-apk
          path: bin/*.apk
