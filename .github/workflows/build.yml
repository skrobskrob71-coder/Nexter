name: Build Nexter APK Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          printf 'y\n' | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexter-debug-apk
          path: bin/*.apk
